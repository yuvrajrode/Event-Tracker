name: Release Gather

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary output
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/gather.exe")) {
            Write-Error "gather.exe was not found in target/release!"
            exit 1
          }
          Get-Item "target/release/gather.exe" | Select-Object Name, Length

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "target/release/gather.exe", "README.md" -DestinationPath "target/release/gather-windows-x64.zip"

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            $isccPath = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $isccPath installer.iss
          if (!(Test-Path "target/release/Gather-Setup-x64.exe")) {
            Write-Error "Gather-Setup-x64.exe was not created!"
            exit 1
          }
          Get-Item "target/release/Gather-Setup-x64.exe" | Select-Object Name, Length

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/gather.exe
            target/release/Gather-Setup-x64.exe
            target/release/gather-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
